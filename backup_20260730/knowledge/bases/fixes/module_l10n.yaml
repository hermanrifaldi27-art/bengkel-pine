rules:
- action:
    anchor: type
    language: pine
    operation: inject_after
    template: '// @UDT_FACTORY: buat fungsi f_build_{type_name}() di FUNCTIONS'
  compatibility:
    pine:
      max: 6
      min: 5
  id: l10n.factory_pattern
  name: UDT besar (>5 field) pakai factory function
  parameters:
  - name: var
    source: ast_identifier
    type: string
  preconditions:
    persistence:
      must_be_var: true
    type_check:
      must_be: array
  priority: low
  triggers:
  - ast_patterns:
    - field_count: '>5'
      node_type: type_declaration
      not_contains: factory
    type: analyzer
  verification:
    compiler:
      must_pass: true
  version: 1
