rules:
- action:
    anchor: VALIDATION
    language: pine
    operation: inject_after
    template: syaratLengkap = sistemAktif and inputValid and dataLengkap
  compatibility:
    pine:
      max: 6
      min: 5
  id: validation.syarat_lengkap
  name: Harus ada validasi syaratLengkap sebelum kalkulasi
  parameters:
  - name: var
    source: ast_identifier
    type: string
  preconditions:
    persistence:
      must_be_var: true
    type_check:
      must_be: array
  priority: high
  triggers:
  - ast_patterns:
    - context: VALIDATION
      node_type: variable_declaration
      not_contains: syaratLengkap
    type: analyzer
  verification:
    compiler:
      must_pass: true
  version: 1
