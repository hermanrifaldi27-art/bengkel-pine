rules:
- action:
    anchor: input
    language: pine
    operation: add_parameter
    template: inline = 'group'
  compatibility:
    pine:
      max: 6
      min: 5
  id: inputs.display_none_inline
  name: display.none harus pakai inline agar tetap terlihat
  parameters:
  - name: var
    source: ast_identifier
    type: string
  preconditions:
    persistence:
      must_be_var: true
    type_check:
      must_be: array
  priority: low
  triggers:
  - ast_patterns:
    - contains: display.none
      node_type: input_declaration
      not_contains: inline
    type: analyzer
  verification:
    compiler:
      must_pass: true
  version: 1
