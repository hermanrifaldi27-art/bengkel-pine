rules:
  - id: functions.no_var
    name: "Fungsi tidak boleh mengandung var"
    version: 1
    priority: required
    compatibility:
      pine:
        min: 5
        max: 6
    triggers:
      - type: analyzer
        ast_patterns:
          - node_type: var_declaration
            context: FUNCTIONS
    preconditions: {}
    parameters:
      - name: var
        type: string
        source: ast_identifier
    action:
      operation: remove_keyword
      anchor: var
      language: pine
      template: ""
      safety:
        reversible: true
        backup_required: true
        modifies_existing_logic: true
    verification:
      compiler:
        must_pass: true
    fallbacks: []
    dependencies: []

  - id: functions.no_return
    name: "Fungsi tidak boleh pakai return eksplisit"
    version: 1
    priority: required
    compatibility:
      pine:
        min: 5
        max: 6
    triggers:
      - type: compiler
        error_signals:
          - "line \\d+: Syntax error.*return"
          - "line \\d+: Unexpected 'return'"
    preconditions: {}
    parameters: []
    action:
      operation: remove_keyword
      anchor: return
      language: pine
      template: ""
      safety:
        reversible: true
        backup_required: true
        modifies_existing_logic: true
    verification:
      compiler:
        must_pass: true
    fallbacks: []
    dependencies: []

  - id: functions.fix_int_na
    name: "Ubah inisialisasi int = na di fungsi menjadi = -1"
    version: 1
    priority: required
    compatibility:
      pine:
        min: 5
        max: 6
    triggers:
      - type: compiler
        error_signals:
          - "Value with NA type cannot be assigned to a variable that was defined without type keyword"
    preconditions: {}
    parameters: []
    action:
      operation: replace
      language: pine
      template: ""
      safety:
        reversible: true
        backup_required: true
        modifies_existing_logic: true
    verification:
      compiler:
        must_pass: true
    fallbacks: []
    dependencies: []
  - id: functions.fix_int_na
    name: "Ubah inisialisasi int = na di fungsi menjadi = -1"
    version: 1
    priority: required
    compatibility:
      pine:
        min: 5
        max: 6
    triggers:
      - type: compiler
        error_signals:
          - "Value with NA type cannot be assigned to a variable that was defined without type keyword"
    preconditions: {}
    parameters: []
    action:
      operation: replace_pattern
      anchor: "= na"
      language: pine
      template: "= -1"
      safety:
        reversible: true
        backup_required: true
        modifies_existing_logic: true
    verification:
      compiler:
        must_pass: true
    fallbacks: []
    dependencies: []
  - id: functions.fix_int_na
    name: "Ubah inisialisasi int = na di fungsi menjadi = -1"
    version: 1
    priority: required
    compatibility:
      pine:
        min: 5
        max: 6
    triggers:
      - type: compiler
        error_signals:
          - "NA type cannot be assigned"
          - "Value with NA"
          - "cannot be assigned to a variable that was defined without type keyword"
    preconditions: {}
    parameters: []
    action:
      operation: replace_pattern
      anchor: "= na"
      language: pine
      template: "= -1"
      safety:
        reversible: true
        backup_required: true
        modifies_existing_logic: true
    verification:
      compiler:
        must_pass: true
    fallbacks: []
    dependencies: []
