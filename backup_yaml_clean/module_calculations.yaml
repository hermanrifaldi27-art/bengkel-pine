rules:
- action:
    language: pine
    operation: replace
    template: '{pivot_func}(...) and barstate.isconfirmed'
  compatibility:
    pine:
      max: 6
      min: 5
  id: calc.pivot_detection_confirmed
  name: Pivot detection harus pakai barstate.isconfirmed
  parameters:
  - name: pivot_func
    source: ast_identifier
    type: string
  preconditions:
    persistence:
      must_be_var: true
    type_check:
      must_be: array
  priority: medium
  triggers:
  - ast_patterns:
    - function_name:
      - ta.pivothigh
      - ta.pivotlow
      node_type: function_call
      not_contains: barstate.isconfirmed
    type: analyzer
  verification:
    compiler:
      must_pass: true
  version: 1
- action:
    anchor: matrix.add_row
    language: pine
    operation: inject_after
    template: "if {var}.rows() > memoryDepth\n    {var}.remove_row({var}.rows() -\
      \ 1)"
  compatibility:
    pine:
      max: 6
      min: 5
  id: calc.matrix_remove_row
  name: Matrix eviction dengan remove_row
  parameters:
  - name: var
    source: ast_identifier
    type: string
  preconditions:
    persistence:
      must_be_var: true
    type_check:
      must_be: array
  priority: high
  triggers:
  - ast_patterns:
    - contains: memoryDepth
      context: CALCULATIONS
      node_type: matrix_new_call
    type: analyzer
  verification:
    compiler:
      must_pass: true
  version: 1
- action:
    anchor: for
    language: pine
    operation: inject_after
    template: '// Weighted voting: w = 1/(1+distance)'
  compatibility:
    pine:
      max: 6
      min: 5
  id: calc.knn.weighted_voting
  name: KNN distance-weighted voting
  parameters:
  - name: neighbors_var
    source: ast_identifier
    type: string
  preconditions:
    persistence:
      must_be_var: true
    type_check:
      must_be: array
  priority: medium
  triggers:
  - ast_patterns:
    - contains: kNeighbors
      context: CALCULATIONS
      node_type: for_loop
    type: analyzer
  verification:
    compiler:
      must_pass: true
  version: 1
- id: calculations.math_abs_v1.bd1d289e
  name: 'Math operation: abs'
  version: 1
  priority: medium
  compatibility:
    pine:
      min: 5
      max: 6
  triggers:
  - type: analyzer
    ast_patterns:
    - node_type: pattern_match
      context: CALCULATIONS
      signature: bd1d289e
  preconditions: {}
  parameters: []
  action:
    operation: inject_after
    anchor: TODO
    language: pine
    template: math.abs(...)
    safety:
      reversible: true
      backup_required: true
      modifies_existing_logic: false
  verification:
    compiler:
      must_pass: true
  fallbacks: []
  dependencies: []
  signature: bd1d289e
  source:
    extractor_version: v2.1
    detector_id: math_abs_v1
