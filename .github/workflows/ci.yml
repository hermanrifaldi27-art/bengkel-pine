name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m unittest tests/test_engine.py -v
      - run: python cli.py validate
      - run: python cli.py repair tests/fixtures/test_array.pine --dry-run
      - run: python cli.py repair tests/fixtures/test_matrix.pine --dry-run
