rules:
  - id: cleanup.fifo.shift
    name: Eviction array FIFO (while + shift)
    version: 1
    priority: required
    compatibility:
      pine:
        min: 5
        max: 6
    triggers:
      - type: compiler
        error_signals:
          - "array.*size.*exceeded"
          - "maximum.*array"
      - type: analyzer
        ast_patterns:
          - node_type: comparison
            left_function: array.size
            context: CALCULATIONS
            contains: array.push
    preconditions:
      persistence:
        must_be_var: true
      type_check:
        must_be: array
    parameters:
      - name: var
        type: string
        source: ast_identifier
        required: true
      - name: limit
        type: int
        default: 100
        minimum: 1
        maximum: 50000
    action:
      operation: inject_after
      anchor: "array.push({var}"
      language: pine
      template: "while array.size({var}) > {limit}\n    array.shift({var})"
      safety:
        reversible: true
        backup_required: true
        modifies_existing_logic: false
    verification:
      compiler:
        must_pass: true
      post_condition:
        function: array.size
        operator: "<="
        value: "{limit}"
    fallbacks:
      - id: cleanup.array.remove_index
    dependencies: []

  - id: cleanup.matrix.remove_row
    name: Eviction matrix dengan remove_row
    version: 1
    priority: high
    compatibility:
      pine:
        min: 5
        max: 6
    triggers:
      - type: analyzer
        ast_patterns:
          - node_type: matrix_new_call
            context: CALCULATIONS
            contains: matrix.add_row
          - node_type: matrix_new_call
            contains: memoryDepth
    preconditions:
      persistence:
        must_be_var: true
      type_check:
        must_be: matrix
    parameters:
      - name: var
        type: string
        source: ast_identifier
        required: true
      - name: limit
        type: int
        default: 500
        minimum: 1
        maximum: 50000
    action:
      operation: inject_after
      anchor: "matrix.add_row({var}"
      language: pine
      template: "if matrix.rows({var}) > {limit}\n    matrix.remove_row({var}, matrix.rows({var}) - 1)"
      safety:
        reversible: true
        backup_required: true
        modifies_existing_logic: false
    verification:
      compiler:
        must_pass: true
      post_condition:
        function: matrix.rows
        operator: "<="
        value: "{limit}"
    fallbacks: []
    dependencies: []
