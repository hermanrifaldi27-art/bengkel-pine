rules:
- action:
    anchor: if not s.act
    language: pine
    operation: inject_after
    template: "if not na(box)\n    box.delete()\n    box := na"
  compatibility:
    pine:
      max: 6
      min: 5
  id: cleanup.box_delete
  name: Box visual harus dihapus saat tidak aktif
  parameters:
  - name: var
    source: ast_identifier
    type: string
  preconditions:
    persistence:
      must_be_var: true
    type_check:
      must_be: array
  priority: medium
  triggers:
  - ast_patterns:
    - context: DRAWINGS
      node_type: box_new_call
      not_contains: delete
    type: analyzer
  verification:
    compiler:
      must_pass: true
  version: 1
- action:
    anchor: array.push({var})
    language: pine
    operation: inject_after
    safety:
      backup_required: true
      modifies_existing_logic: false
      reversible: true
    template: "while array.size({var}) > {limit}\n    array.shift({var})"
  compatibility:
    pine:
      max: 6
      min: 5
  id: cleanup.fifo.shift
  name: Eviction array FIFO (while + shift)
  parameters:
  - name: var
    source: ast_identifier
    type: string
  - default: 100
    maximum: 50000
    minimum: 1
    name: limit
    type: int
  preconditions:
    persistence:
      must_be_initialized: true
      must_be_var: true
    scope_check:
      allowed_scopes:
      - global
      - module
    type_check:
      must_be: array
  priority: required
  triggers:
  - error_signals:
    - 'line \d+: .*array.*size.*'
    - 'line \d+: .*maximum.*array.*'
    type: compiler
  - ast_patterns:
    - left_function: array.size
      left_var: '{var}'
      node_type: comparison
      operator: '>'
      right_type:
      - integer
      - identifier
    type: analyzer
  verification:
    compiler:
      must_pass: true
    post_condition:
      function: array.size
      operator: <=
      value: '{limit}'
      variable: '{var}'
  version: 1
