    template: "switch mtype\n        'SMA'                   => _sma\n        'SMA\
      \ + Bollinger Bands' => _sma\n        'EMA'                   => _ema\n    \
      \    'SMMA (RMA)'            => _rma\n        'WMA'                   => _wma\n\
      \        'VWMA'                  => _vwma\n        => na\n\n// ~~ Fisher-discriminant\
      \ feature importance over the labeled bank (bull vs bear clusters). {\n// ~~\
      \ Returns an 8-slot array of weights scaled to [floor, 10]. {\nautoFeatureWeights(matrix<float>\
      \ m, int minRows, float floor) =>\n    int n = m.rows()\n    array<float> imp\
      \ = array.new<float>(8, 1.0)\n    if n >= minRows\n        array<float> sumB\
      \  = array.new<float>(8, 0.0)\n        array<float> sumBe = array.new<float>(8,\
      \ 0.0)\n        array<float> sqB   = array.new<float>(8, 0.0)\n        array<float>\
      \ sqBe  = array.new<float>(8, 0.0)\n        int cntB = 0\n        int cntBe\
      \ = 0\n        // ~~ one pass: accumulate per-class sums & sums-of-squares (online\
      \ clustering) {\n        for i = 0 to n - 1 by 1\n            float o = m.get(i,\
      \ 8)\n            if o > 0 or o < 0\n                bool isB = o > 0\n    \
      \            for j = 0 to 7 by 1\n                    float v = m.get(i, j)\n\
      \                    if isB\n                        sumB.set(j, sumB.get(j)\
      \ + v)\n                        sqB.set(j, sqB.get(j) + v * v)\n           \
      \         else\n                        sumBe.set(j, sumBe.get(j) + v)\n   \
      \                     sqBe.set(j, sqBe.get(j) + v * v)\n                cntB\
      \ := isB ? cntB + 1 : cntB\n                cntBe := isB ? cntBe : cntBe + 1\n\
      \                //}"
