    version: 1
    priority: required
    compatibility:
      pine:
        min: 5
        max: 6
    triggers:
      - type: analyzer
        ast_patterns:
          - node_type: plot_call
            parent_scope: if
            context: PLOTS
    preconditions: {}
    parameters: []
    action:
      operation: move_to_global
      language: pine
      template: |
        // TODO: Pindahkan plot ke global scope
        // Gunakan ternary: plot(kondisi ? nilai : na)
      safety:
        reversible: true
        backup_required: true
        modifies_existing_logic: false
    verification:
      compiler:
        must_pass: true
    fallbacks: []
    dependencies: []
